services:
  registry:
    image: registry:2
    container_name: local-registry
    restart: unless-stopped
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - ./data:/var/lib/registry
      - ./auth:/auth
    environment:
      REGISTRY_AUTH: htpasswd
      REGISTRY_AUTH_HTPASSWD_REALM: "Registry Realm"
      REGISTRY_AUTH_HTPASSWD_PATH: /auth/htpasswd.txt

  registry-ui:
    image: joxit/docker-registry-ui:latest
    container_name: registry-ui
    restart: unless-stopped
    environment:
      REGISTRY_TITLE: "Private Docker Registry"
      REGISTRY_URL: "https://registry.local"
      SINGLE_REGISTRY: "true"
      NGINX_PROXY_PASS_URL: "http://registry:5000"
    depends_on:
      - registry

  elasticsearch:
    image: registry.local:443/elasticsearch:8.15.0
    container_name: elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=true
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    volumes:
      - ./elk/elastic-data:/usr/share/elasticsearch/data
    ports:
      - "127.0.0.1:9200:9200"

  kibana:
    image: registry.local:443/kibana:8.15.0
    container_name: kibana
    restart: unless-stopped
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - ELASTICSEARCH_USERNAME=kibana_system
      - ELASTICSEARCH_PASSWORD=${KIBANA_SYSTEM_PASSWORD}
      - SERVER_PUBLICBASEURL=https://kibana.local
    depends_on:
      - elasticsearch
    ports:
      - "127.0.0.1:5601:5601"

  metricbeat:
    image: registry.local:443/metricbeat:8.15.0
    container_name: metricbeat
    restart: unless-stopped
    user: root
    environment:
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
    volumes:
      - ./elk/metricbeat/metricbeat.yml:/usr/share/metricbeat/metricbeat.yml:ro
      - /proc:/hostfs/proc:ro
      - /sys/fs/cgroup:/hostfs/sys/fs/cgroup:ro
      - /:/hostfs:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: metricbeat -e -system.hostfs=/hostfs
    depends_on:
      - elasticsearch
      - kibana

  filebeat:
    image: registry.local:443/filebeat:8.15.0
    container_name: filebeat
    restart: unless-stopped
    user: root
    environment:
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
    volumes:
      - ./elk/filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - /var/log:/hostfs/var/log:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: filebeat -e
    depends_on:
      - elasticsearch
      - kibana

  heartbeat:
    image: registry.local:443/heartbeat:8.15.0
    container_name: heartbeat
    restart: unless-stopped
    user: root
    environment:
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
    volumes:
      - ./elk/heartbeat/heartbeat.yml:/usr/share/heartbeat/heartbeat.yml:ro
    command: heartbeat -e
    depends_on:
      - elasticsearch
      - kibana

  wp-db:
    image: registry.local:443/mysql:8.0
    container_name: wp-db
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
    volumes:
      - ./wordpress/db-data:/var/lib/mysql
    networks:
      - db-net

  wordpress:
    image: registry.local:443/wordpress:6-fpm-alpine
    container_name: wp-app
    restart: unless-stopped
    environment:
      - WORDPRESS_DB_HOST=wp-db
      - WORDPRESS_DB_NAME=${MYSQL_DATABASE}
      - WORDPRESS_DB_USER=${MYSQL_USER}
      - WORDPRESS_DB_PASSWORD=${MYSQL_PASSWORD}
    volumes:
      - ./wordpress/wp-data:/var/www/html
    depends_on:
      - wp-db
    networks:
      - db-net
      - app-net

  nginx:
    image: registry.local:443/unified-nginx:1.0
    container_name: unified-nginx
    restart: unless-stopped
    ports:
      - "443:443"
      - "80:80"
    depends_on:
      - registry
      - registry-ui
      - elasticsearch
      - kibana
      - wordpress
      - vote
      - result
    networks:
      - default
      - app-net
      - vote-front-net

  vote:
    image: registry.local:443/vote-app-vote:1.0
    container_name: vote-app
    restart: unless-stopped
    depends_on:
      - redis
    networks:
      - vote-front-net
      - vote-back-net

  result:
    image: registry.local:443/vote-app-result:1.0
    container_name: result-app
    restart: unless-stopped
    depends_on:
      - db
    networks:
      - vote-front-net
      - vote-back-net

  worker:
    image: registry.local:443/vote-app-worker:1.0
    container_name: worker-app
    restart: unless-stopped
    depends_on:
      - redis
      - db
    networks:
      - vote-back-net

  redis:
    image: registry.local:443/redis:alpine
    container_name: vote-redis
    restart: unless-stopped
    networks:
      - vote-back-net

  db:
    image: registry.local:443/postgres:15-alpine
    container_name: vote-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - ./vote-app/db-data:/var/lib/postgresql/data
    networks:
      - vote-back-net

networks:
  db-net:
    driver: bridge
  app-net:
    driver: bridge
  vote-front-net:
    driver: bridge
  vote-back-net:
    driver: bridge

volumes: {}